<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wine Cellar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, rgba(139, 26, 26, 0.25), transparent 34%), #140c0d;
        color: #f5f0e8;
        font-family: Segoe UI, Arial, sans-serif;
      }
      main {
        width: min(440px, calc(100vw - 40px));
        border: 1px solid rgba(212, 175, 55, 0.22);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #b09aa8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wine Cellar</h1>
      <p>The desktop app could not start Wine Cellar locally. Close the app and reopen it. If it still fails, reinstall the desktop build.</p>
    </main>
  </body>
</html>
